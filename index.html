<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Task Manager</title>

<style>
:root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --text: #172033;
    --muted: #718096;
    --border: #e5eaf1;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --warning: #f59e0b;
    --danger: #ef4444;
    --shadow: 0 12px 35px rgba(15, 23, 42, .08);
}

body.dark {
    --bg: #0f172a;
    --surface: #172033;
    --surface-2: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
    --shadow: 0 15px 40px rgba(0,0,0,.25);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: .25s;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(1180px, 94%);
    margin: 0 auto;
    padding: 35px 0 60px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-size: 25px;
    box-shadow: 0 10px 25px rgba(37,99,235,.25);
}

.brand h1 {
    margin: 0;
    font-size: 28px;
}

.brand p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    width: 45px;
    height: 45px;
    border-radius: 13px;
    box-shadow: var(--shadow);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 25px;
}

.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
}

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: #eff6ff;
    color: var(--primary);
}

body.dark .stat-icon {
    background: #1e3a8a;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
    margin-top: 12px;
}

/* PROGRESS */

.progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 25px;
}

.progress-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

.progress-header span:first-child {
    font-weight: 700;
}

.progress-header span:last-child {
    color: var(--primary);
    font-weight: 800;
}

.progress-track {
    height: 10px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    transition: width .4s ease;
}

/* ADD TASK */

.add-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 25px;
}

.add-title {
    margin: 0 0 16px;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 12px;
}

.input,
.select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 13px 14px;
    border-radius: 12px;
    outline: none;
    transition: .2s;
}

.input:focus,
.select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

.primary-btn {
    border: 0;
    background: var(--primary);
    color: white;
    padding: 0 20px;
    border-radius: 12px;
    font-weight: 700;
    transition: .2s;
}

.primary-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

/* TOOLBAR */

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.search {
    position: relative;
    flex: 1;
}

.search span {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.search input {
    padding-left: 42px;
}

.toolbar-right {
    display: flex;
    gap: 8px;
}

.filter-btn,
.sort-select {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 11px;
    padding: 10px 13px;
}

.filter-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* TASKS */

.task-list {
    display: grid;
    gap: 12px;
}

.task {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 17px;
    box-shadow: 0 5px 20px rgba(15,23,42,.04);
    transition: .25s;
    animation: slideIn .25s ease;
}

.task:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.check {
    width: 22px;
    height: 22px;
    accent-color: var(--primary);
    flex-shrink: 0;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-weight: 700;
    margin-bottom: 7px;
    word-break: break-word;
}

.task.completed .task-title {
    text-decoration: line-through;
    color: var(--muted);
}

.task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
}

.priority-high {
    background: #fee2e2;
    color: #b91c1c;
}

.priority-medium {
    background: #fef3c7;
    color: #92400e;
}

.priority-low {
    background: #dcfce7;
    color: #166534;
}

.due {
    background: var(--surface-2);
    color: var(--muted);
}

.overdue {
    background: #fee2e2;
    color: #b91c1c;
}

.task-actions {
    display: flex;
    gap: 7px;
}

.action-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 10px;
}

.action-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.action-btn.delete:hover {
    border-color: var(--danger);
    color: var(--danger);
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 55px 20px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 18px;
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.empty h3 {
    margin: 0 0 6px;
}

.empty p {
    color: var(--muted);
    margin: 0;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.6);
    display: none;
    place-items: center;
    padding: 20px;
    z-index: 1000;
    backdrop-filter: blur(5px);
}

.modal.show {
    display: grid;
}

.modal-box {
    width: min(500px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,.25);
    animation: modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(.96) translateY(10px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
}

.close {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 25px;
}

.modal-form {
    display: grid;
    gap: 13px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 5px;
}

.secondary-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 11px 17px;
    border-radius: 11px;
}

/* TOAST */

.toast-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 2000;
    display: grid;
    gap: 10px;
}

.toast {
    background: #172033;
    color: white;
    padding: 13px 17px;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,.2);
    animation: toastIn .25s ease;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FOOTER */

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 35px;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr 1fr;
    }

    .form-grid .input {
        grid-column: 1 / -1;
    }

    .form-grid .primary-btn {
        min-height: 46px;
    }
}

@media (max-width: 650px) {
    .app {
        width: 92%;
        padding-top: 22px;
    }

    .header {
        align-items: flex-start;
    }

    .brand h1 {
        font-size: 22px;
    }

    .logo {
        width: 45px;
        height: 45px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stat-card {
        padding: 15px;
    }

    .stat-number {
        font-size: 24px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-grid .input {
        grid-column: auto;
    }

    .primary-btn {
        min-height: 46px;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .toolbar-right {
        overflow-x: auto;
    }

    .task {
        align-items: flex-start;
    }

    .task-actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <div class="logo">✓</div>
            <div>
                <h1>Smart Task Manager</h1>
                <p>Organize your work. Stay productive.</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
        </div>
    </header>

    <section class="stats">

        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-label">Total Tasks</span>
                <div class="stat-icon">📋</div>
            </div>
            <div class="stat-number" id="totalCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-label">Completed</span>
                <div class="stat-icon">✓</div>
            </div>
            <div class="stat-number" id="completedCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-label">Remaining</span>
                <div class="stat-icon">⏳</div>
            </div>
            <div class="stat-number" id="remainingCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-label">Overdue</span>
                <div class="stat-icon">!</div>
            </div>
            <div class="stat-number" id="overdueCount">0</div>
        </div>

    </section>

    <section class="progress-card">
        <div class="progress-header">
            <span>Overall Progress</span>
            <span id="progressText">0%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <section class="add-card">

        <h2 class="add-title">Add New Task</h2>

        <div class="form-grid">
            <input
                id="taskInput"
                class="input"
                type="text"
                placeholder="What needs to be done?"
                maxlength="150"
            >

            <select id="priorityInput" class="select">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <input
                id="dateInput"
                class="input"
                type="date"
            >

            <button class="primary-btn" id="addBtn">
                + Add Task
            </button>
        </div>

    </section>

    <section class="toolbar">

        <div class="search">
            <span>🔍</span>
            <input
                id="searchInput"
                class="input"
                type="text"
                placeholder="Search tasks..."
            >
        </div>

        <div class="toolbar-right">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="active">
                Active
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

            <select id="sortSelect" class="sort-select">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="priority">Priority</option>
                <option value="date">Due Date</option>
            </select>

        </div>

    </section>

    <section id="taskList" class="task-list"></section>

    <footer class="footer">
        Smart Task Manager v2.0 • Open Source
    </footer>

</div>


<!-- EDIT MODAL -->

<div class="modal" id="editModal">

    <div class="modal-box">

        <div class="modal-header">
            <h2>Edit Task</h2>
            <button class="close" id="closeModal">×</button>
        </div>

        <div class="modal-form">

            <input
                id="editTitle"
                class="input"
                type="text"
                maxlength="150"
                placeholder="Task title"
            >

            <select id="editPriority" class="select">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <input
                id="editDate"
                class="input"
                type="date"
            >

            <div class="modal-actions">
                <button class="secondary-btn" id="cancelEdit">
                    Cancel
                </button>

                <button class="primary-btn" id="saveEdit">
                    Save Changes
                </button>
            </div>

        </div>

    </div>

</div>


<div class="toast-container" id="toastContainer"></div>


<script>

const STORAGE_KEY = "smartTasks";

let tasks = [];
let currentFilter = "all";
let currentSearch = "";
let editingId = null;


/* LOAD */

function loadTasks() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            tasks = [];
            return;
        }

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            tasks = parsed.map(normalizeTask);
        } else {
            tasks = [];
        }

    } catch (error) {

        console.error("Could not load tasks:", error);
        tasks = [];

    }
}


/* NORMALIZE */

function normalizeTask(task) {

    return {
        id: task.id || Date.now() + Math.random(),
        title: String(task.title || task.text || "Untitled task"),
        completed: Boolean(task.completed),
        priority: ["low", "medium", "high"].includes(task.priority)
            ? task.priority
            : "medium",
        dueDate: task.dueDate || task.date || "",
        createdAt: task.createdAt || Date.now()
    };

}


/* SAVE */

function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}


/* ESCAPE */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* DATE */

function formatDate(dateString) {

    if (!dateString) return "";

    const date = new Date(dateString + "T00:00:00");

    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
    });

}


function isOverdue(task) {

    if (!task.dueDate || task.completed) return false;

    const today = new Date();
    today.setHours(0,0,0,0);

    const due = new Date(task.dueDate + "T00:00:00");

    return due < today;

}


/* PRIORITY */

function priorityLabel(priority) {

    if (priority === "high") return "High";
    if (priority === "medium") return "Medium";
    return "Low";

}


/* ADD */

function addTask() {

    const title = document.getElementById("taskInput").value.trim();
    const priority = document.getElementById("priorityInput").value;
    const dueDate = document.getElementById("dateInput").value;

    if (!title) {

        showToast("Please enter a task.");
        document.getElementById("taskInput").focus();
        return;

    }

    const task = {
        id: Date.now(),
        title,
        completed: false,
        priority,
        dueDate,
        createdAt: Date.now()
    };

    tasks.unshift(task);

    saveTasks();
    render();

    document.getElementById("taskInput").value = "";
    document.getElementById("dateInput").value = "";
    document.getElementById("priorityInput").value = "medium";

    showToast("Task added successfully ✓");

}


/* TOGGLE */

function toggleTask(id) {

    const task = tasks.find(t => String(t.id) === String(id));

    if (!task) return;

    task.completed = !task.completed;

    saveTasks();
    render();

    if (task.completed) {
        showToast("Task completed 🎉");
    }

}


/* DELETE */

function deleteTask(id) {

    const task = tasks.find(t => String(t.id) === String(id));

    if (!task) return;

    if (!confirm(`Delete "${task.title}"?`)) return;

    tasks = tasks.filter(t => String(t.id) !== String(id));

    saveTasks();
    render();

    showToast("Task deleted");

}


/* EDIT */

function openEdit(id) {

    const task = tasks.find(t => String(t.id) === String(id));

    if (!task) return;

    editingId = id;

    document.getElementById("editTitle").value = task.title;
    document.getElementById("editPriority").value = task.priority;
    document.getElementById("editDate").value = task.dueDate || "";

    document.getElementById("editModal").classList.add("show");

    setTimeout(() => {
        document.getElementById("editTitle").focus();
    }, 100);

}


function closeEdit() {

    editingId = null;
    document.getElementById("editModal").classList.remove("show");

}


function saveEdit() {

    if (editingId === null) return;

    const task = tasks.find(t => String(t.id) === String(editingId));

    if (!task) return;

    const title = document.getElementById("editTitle").value.trim();

    if (!title) {
        showToast("Task title cannot be empty.");
        return;
    }

    task.title = title;
    task.priority = document.getElementById("editPriority").value;
    task.dueDate = document.getElementById("editDate").value;

    saveTasks();
    render();
    closeEdit();

    showToast("Task updated ✓");

}


/* FILTER */

function setFilter(filter) {

    currentFilter = filter;

    document.querySelectorAll(".filter-btn").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.filter === filter
        );

    });

    render();

}


/* SORT */

function sortTasks(list) {

    const sort = document.getElementById("sortSelect").value;

    if (sort === "newest") {
        return list.sort((a,b) => b.createdAt - a.createdAt);
    }

    if (sort === "oldest") {
        return list.sort((a,b) => a.createdAt - b.createdAt);
    }

    if (sort === "priority") {

        const rank = {
            high: 1,
            medium: 2,
            low: 3
        };

        return list.sort(
            (a,b) => rank[a.priority] - rank[b.priority]
        );

    }

    if (sort === "date") {

        return list.sort((a,b) => {

            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;

            return a.dueDate.localeCompare(b.dueDate);

        });

    }

    return list;

}


/* RENDER */

function render() {

    updateStats();

    const list = tasks.filter(task => {

        if (currentFilter === "active" && task.completed) {
            return false;
        }

        if (currentFilter === "completed" && !task.completed) {
            return false;
        }

        if (currentSearch) {

            return task.title
                .toLowerCase()
                .includes(currentSearch.toLowerCase());

        }

        return true;

    });

    sortTasks(list);

    const container = document.getElementById("taskList");

    if (!list.length) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📝</div>
                <h3>No tasks found</h3>
                <p>Add a new task or change your search/filter.</p>
            </div>
        `;

        return;

    }

    container.innerHTML = list.map(task => {

        const overdue = isOverdue(task);

        return `
            <article class="task ${task.completed ? "completed" : ""}">

                <input
                    class="check"
                    type="checkbox"
                    ${task.completed ? "checked" : ""}
                    onchange="toggleTask('${task.id}')"
                    aria-label="Complete task"
                >

                <div class="task-content">

                    <div class="task-title">
                        ${escapeHTML(task.title)}
                    </div>

                    <div class="task-meta">

                        <span class="badge priority-${task.priority}">
                            ${priorityLabel(task.priority)}
                        </span>

                        ${
                            task.dueDate
                            ? `
                                <span class="badge ${overdue ? "overdue" : "due"}">
                                    📅 ${formatDate(task.dueDate)}
                                    ${overdue ? " • Overdue" : ""}
                                </span>
                            `
                            : ""
                        }

                    </div>

                </div>

                <div class="task-actions">

                    <button
                        class="action-btn"
                        onclick="openEdit('${task.id}')"
                        title="Edit"
                    >
                        ✏️
                    </button>

                    <button
                        class="action-btn delete"
                        onclick="deleteTask('${task.id}')"
                        title="Delete"
                    >
                        🗑️
                    </button>

                </div>

            </article>
        `;

    }).join("");

}


/* STATS */

function updateStats() {

    const total = tasks.length;

    const completed = tasks.filter(
        task => task.completed
    ).length;

    const remaining = total - completed;

    const overdue = tasks.filter(
        task => isOverdue(task)
    ).length;

    const progress = total
        ? Math.round((completed / total) * 100)
        : 0;

    document.getElementById("totalCount").textContent = total;
    document.getElementById("completedCount").textContent = completed;
    document.getElementById("remainingCount").textContent = remaining;
    document.getElementById("overdueCount").textContent = overdue;

    document.getElementById("progressText").textContent =
        progress + "%";

    document.getElementById("progressFill").style.width =
        progress + "%";

}


/* TOAST */

function showToast(message) {

    const container =
        document.getElementById("toastContainer");

    const toast =
        document.createElement("div");

    toast.className = "toast";
    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {

        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";

        setTimeout(() => toast.remove(), 250);

    }, 2200);

}


/* THEME */

function loadTheme() {

    const theme =
        localStorage.getItem("smartTheme");

    if (theme === "dark") {

        document.body.classList.add("dark");

        document.getElementById("themeBtn").textContent = "☀️";

    }

}


function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "smartTheme",
        dark ? "dark" : "light"
    );

    document.getElementById("themeBtn").textContent =
        dark ? "☀️" : "🌙";

}


/* EVENTS */

document.getElementById("addBtn")
    .addEventListener("click", addTask);


document.getElementById("taskInput")
    .addEventListener("keydown", event => {

        if (event.key === "Enter") {
            addTask();
        }

    });


document.getElementById("searchInput")
    .addEventListener("input", event => {

        currentSearch = event.target.value.trim();

        render();

    });


document.querySelectorAll(".filter-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => setFilter(button.dataset.filter)
        );

    });


document.getElementById("sortSelect")
    .addEventListener("change", render);


document.getElementById("themeBtn")
    .addEventListener("click", toggleTheme);


document.getElementById("closeModal")
    .addEventListener("click", closeEdit);


document.getElementById("cancelEdit")
    .addEventListener("click", closeEdit);


document.getElementById("saveEdit")
    .addEventListener("click", saveEdit);


document.getElementById("editModal")
    .addEventListener("click", event => {

        if (event.target.id === "editModal") {
            closeEdit();
        }

    });


document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeEdit();
    }

});


/* START */

loadTasks();
loadTheme();
render();

</script>

</body>
</html>
