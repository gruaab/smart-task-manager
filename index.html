```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Task Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    transition: 0.3s;
}

body.dark {
    background: #111827;
    color: #f9fafb;
}

.container {
    width: 92%;
    max-width: 850px;
    margin: 40px auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.theme-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.add-box {
    display: grid;
    grid-template-columns: 1fr 140px 150px 100px;
    gap: 10px;
    margin-bottom: 20px;
}

input, select {
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.add-btn {
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.search {
    width: 100%;
    margin-bottom: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
}

body.dark .stat,
body.dark .task {
    background: #1f2937;
}

.stat strong {
    display: block;
    font-size: 25px;
    margin-top: 5px;
}

.progress {
    height: 10px;
    background: #d1d5db;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: 0.3s;
}

    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.filter-btn {
    border: none;
    padding: 9px 15px;

    background: #2563eb;
    color: white;
}

    border-radius: 10px;

@media (max-width: 700px) {

    .add-box {
        grid-template-columns: 1fr;

    .stats {
        grid-template-columns: 1fr;

</head>

<body>

<div class="container">

    <div class="header">
        <h1>Smart Task Manager</h1>

        <button class="theme-btn" onclick="toggleTheme()">
            Dark Mode
        </button>
    </div>

    <div class="add-box">

        <input
            id="taskInput"
            type="text"
            placeholder="Enter a task..."
        >

        <select id="priority">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
        </select>

        <input
            id="dueDate"
            type="date"
        >

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>

    </div>

    <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Search tasks..."
        oninput="renderTasks()"
    >

    <div class="stats">

        <div class="stat">
            Total
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            Completed
            <strong id="completed">0</strong>
        </div>

        <div class="stat">
            Remaining
            <strong id="remaining">0</strong>
        </div>

    </div>

    <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div class="filters">

        <button class="filter-btn active"
                onclick="setFilter('all', this)">
            All
        </button>

        <button class="filter-btn"
                onclick="setFilter('active', this)">
            Active
        </button>

        <button class="filter-btn"
                onclick="setFilter('completed', this)">
            Completed
        </button>

    </div>

    <div id="taskList"></div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("smartTasks")) || [];
let currentFilter = "all";

function saveTasks() {
    localStorage.setItem(
        "smartTasks",
        JSON.stringify(tasks)
    );
}

function addTask() {

    const input = document.getElementById("taskInput");
    const priority = document.getElementById("priority").value;
    const dueDate = document.getElementById("dueDate").value;

    const text = input.value.trim();

    if (!text) {
        alert("Please enter a task.");
        return;
    }

    tasks.push({
        id: Date.now(),
        text: text,
        priority: priority,
        dueDate: dueDate,
        completed: false
    });

    input.value = "";
    document.getElementById("dueDate").value = "";

    saveTasks();
    renderTasks();
}

function toggleTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {
            task.completed = !task.completed;
        }

        return task;
    });

    saveTasks();
    renderTasks();
}

function deleteTask(id) {

    if (!confirm("Delete this task?")) {
        return;
    }

    tasks = tasks.filter(task => task.id !== id);

    saveTasks();
    renderTasks();
}

function editTask(id) {

    const task = tasks.find(task => task.id === id);

    if (!task) return;

    const newText = prompt(
        "Edit task:",
        task.text
    );

    if (newText === null) return;

    const cleanText = newText.trim();

    if (!cleanText) return;

    task.text = cleanText;

    saveTasks();
    renderTasks();
}

function setFilter(filter, button) {

    currentFilter = filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderTasks();
}

function renderTasks() {

    const list = document.getElementById("taskList");
    const search = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    list.innerHTML = "";

    let filtered = tasks.filter(task =>
        task.text.toLowerCase().includes(search)
    );

    if (currentFilter === "active") {
        filtered = filtered.filter(
            task => !task.completed
        );
    }

    if (currentFilter === "completed") {
        filtered = filtered.filter(
            task => task.completed
        );
    }

    filtered.forEach(task => {

        const div = document.createElement("div");

        div.className =
            "task" +
            (task.completed ? " done" : "");

        const dateText =
            task.dueDate
            ? "Due: " + task.dueDate
            : "No due date";

        div.innerHTML = `

            <input
                class="check"
                type="checkbox"
                ${task.completed ? "checked" : ""}
                onchange="toggleTask(${task.id})"
            >

            <div class="task-info">

                <div class="task-name">
                    ${escapeHTML(task.text)}
                </div>

                <div class="task-meta">
                    ${dateText}
                </div>

            </div>

            <span class="priority ${task.priority}">
                ${task.priority.toUpperCase()}
            </span>

            <div class="actions">

                <button
                    class="action-btn edit"
                    onclick="editTask(${task.id})">
                    Edit
                </button>

                <button
                    class="action-btn delete"
                    onclick="deleteTask(${task.id})">
                    Delete
                </button>

            </div>
        `;

        list.appendChild(div);
    });

    updateStats();
}

function updateStats() {

    const total = tasks.length;

    const completed =
        tasks.filter(task => task.completed).length;

    const remaining = total - completed;

    document.getElementById("total").textContent = total;
    document.getElementById("completed").textContent = completed;
    document.getElementById("remaining").textContent = remaining;

    const percentage =
        total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("progressBar").style.width =
        percentage + "%";
}

function toggleTheme() {
    document.body.classList.toggle("dark");
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

document
    .getElementById("taskInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            addTask();
        }

    });

renderTasks();

</script>

</body>
</html>
