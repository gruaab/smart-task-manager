<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Task Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            transition: 0.3s;
        }

        body.dark {
            background: #111827;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .theme-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }

        body.dark .stats {
            background: #1f2937;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            background: #e5e7eb;
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 9px;
        }

        body.dark li {
            background: #1f2937;
        }

        .task-text {
            cursor: pointer;
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .delete-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            .input-area {
                flex-direction: column;
            }

            .add-btn {
                padding: 12px;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Smart Task Manager</h1>

        <button class="theme-btn" onclick="toggleTheme()">
            Dark Mode
        </button>

    </div>

    <div class="input-area">

        <input
            id="taskInput"
            type="text"
            placeholder="Enter a new task..."
        >

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>

    </div>

    <div class="stats">

        <span>
            Total: <strong id="totalTasks">0</strong>
        </span>

        <span>
            Completed: <strong id="completedTasks">0</strong>
        </span>

        <span>
            Remaining: <strong id="remainingTasks">0</strong>
        </span>

    </div>

    <div class="filters">

        <button
            class="filter-btn active"
            onclick="setFilter('all', this)">
            All
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('active', this)">
            Active
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('completed', this)">
            Completed
        </button>

    </div>

    <ul id="taskList"></ul>

</div>

<script>

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    let currentFilter = "all";


    function saveTasks() {

        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );

    }


    function addTask() {

        const input =
            document.getElementById("taskInput");

        const text = input.value.trim();

        if (text === "") {
            return;
        }

        tasks.push({
            id: Date.now(),
            text: text,
            completed: false
        });

        input.value = "";

        saveTasks();

        renderTasks();

    }


    function toggleTask(id) {

        tasks = tasks.map(task => {

            if (task.id === id) {
                task.completed = !task.completed;
            }

            return task;

        });

        saveTasks();

        renderTasks();

    }


    function deleteTask(id) {

        tasks = tasks.filter(
            task => task.id !== id
        );

        saveTasks();

        renderTasks();

    }


    function setFilter(filter, button) {

        currentFilter = filter;

        document
            .querySelectorAll(".filter-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        renderTasks();

    }


    function renderTasks() {

        const list =
            document.getElementById("taskList");

        list.innerHTML = "";

        let filteredTasks = tasks;

        if (currentFilter === "active") {

            filteredTasks =
                tasks.filter(task => !task.completed);

        }

        if (currentFilter === "completed") {

            filteredTasks =
                tasks.filter(task => task.completed);

        }


        filteredTasks.forEach(task => {

            const li =
                document.createElement("li");

            const text =
                document.createElement("span");

            text.textContent = task.text;

            text.className = "task-text";

            if (task.completed) {
                text.classList.add("completed");
            }

            text.onclick = () =>
                toggleTask(task.id);


            const deleteButton =
                document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete-btn";

            deleteButton.onclick = () =>
                deleteTask(task.id);


            li.appendChild(text);

            li.appendChild(deleteButton);

            list.appendChild(li);

        });


        updateStats();

    }


    function updateStats() {

        const total = tasks.length;

        const completed =
            tasks.filter(task => task.completed).length;

        const remaining =
            total - completed;


        document.getElementById(
            "totalTasks"
        ).textContent = total;


        document.getElementById(
            "completedTasks"
        ).textContent = completed;


        document.getElementById(
            "remainingTasks"
        ).textContent = remaining;

    }


    function toggleTheme() {

        document.body.classList.toggle("dark");

    }


    document
        .getElementById("taskInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                addTask();
            }

        });


    renderTasks();

</script>

</body>

</html>
